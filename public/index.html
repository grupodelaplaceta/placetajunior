<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Placeta Junior — Web oficial del proyecto</title>
  <meta name="description" content="Web oficial del proyecto Placeta Junior · Grupo de La Placeta. Actividades educativas públicas, Studio e información del programa educativo." />
  <link rel="stylesheet" href="css/styles.css?v=20260823" />
  <link rel="stylesheet" href="css/home.css?v=20260824" />
  <link rel="icon" href="img/logo.png" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
</head>
<body class="pj-home">
  <!-- Pantalla de carga inicial -->
  <div id="pj-loading" class="pj-loading" aria-live="polite" aria-label="Cargando">
    <div class="pj-loading-inner">
      <img class="pj-loading-logo" src="img/PJ-BLANCO-LOGO.png" alt="Placeta Junior" />
      <div class="pj-loading-spinner" aria-hidden="true"></div>
      <p class="pj-loading-text">Cargando actividades…</p>
    </div>
  </div>

  <!-- Tira arcoíris de marca (borde superior) -->
  <div class="strip" aria-hidden="true"></div>

  <!-- Barra de navegación -->
  <header class="nav">
    <input type="checkbox" id="nav-toggle" class="nav-toggle" hidden />
    <div class="nav-inner">
      <a class="brand" href="/">
        <img src="img/PJ-BLANCO-LOGO.png" alt="Placeta Junior" />
      </a>
      <label for="nav-toggle" class="nav-toggle-btn" aria-label="Abrir menú">
        <span></span><span></span><span></span>
      </label>
      <nav class="nav-links">
        <a href="/" class="active">Inicio</a>
        <a href="#actividades">Actividades</a>
        <a href="/info">Info</a>
      </nav>
      <div class="nav-cta">
        <a class="btn btn-primary" href="#actividades"><span class="material-symbols-rounded">play_arrow</span> Jugar</a>
      </div>
    </div>
  </header>

  <!-- Hero -->
  <section class="hero">
    <div class="hero-shapes">
      <span class="shape" style="color:var(--pj-red);top:12%;left:6%;"></span>
      <span class="shape" style="color:var(--pj-orange);top:24%;right:8%;animation-delay:1.2s;"></span>
      <span class="shape" style="color:var(--pj-blue);bottom:12%;left:14%;animation-delay:2.4s;"></span>
      <span class="shape" style="color:var(--pj-green);bottom:18%;right:16%;animation-delay:.6s;"></span>
    </div>
    <div class="hero-inner">
      <h1 class="sr-only">Placeta Junior</h1>
      <img class="hero-banner" src="img/bannerpj.jpg" alt="Placeta Junior" />
      <div class="cta-row">
        <a class="btn btn-primary" href="#actividades"><span class="material-symbols-rounded">play_arrow</span> Jugar</a>
      </div>
      <div id="nivel-badge" class="nivel-badge" hidden></div>
    </div>
  </section>

  <main>
    <section class="section" id="actividades">
      <div class="section-head">
        <h2>Actividades</h2>
        <p>Desliza para ver más de cada categoría. ¡Hay para todos los gustos!</p>
      </div>
      <div id="error-banner" class="error-banner hidden"></div>

      <div class="edad-filter" role="group" aria-label="Filtrar actividades por edad">
        <button type="button" class="ef-btn active" data-edad="todas" onclick="setFiltroEdad('todas', this)">Todas las edades</button>
        <button type="button" class="ef-btn" data-edad="0-5" onclick="setFiltroEdad('0-5', this)">3-5 años</button>
        <button type="button" class="ef-btn" data-edad="6-8" onclick="setFiltroEdad('6-8', this)">6-8 años</button>
        <button type="button" class="ef-btn" data-edad="9-12" onclick="setFiltroEdad('9-12', this)">9-12 años</button>
        <button type="button" class="ef-btn" data-edad="13+" onclick="setFiltroEdad('13+', this)">12+ años</button>
        <span class="ef-count" id="edad-count"></span>
      </div>

      <h3 class="cat-title" data-color="orange"><span class="t-ico material-symbols-rounded">star</span> Populares</h3>
      <div id="populares-row" class="h-row"><div class="loader"></div></div>

      <div id="categorias"></div>
    </section>
  </main>

  <!-- Página de detalle de actividad (a pantalla completa, no popup) -->
  <div id="detail-page" class="detail-page" aria-live="polite"></div>

  <!-- Página de juego (a pantalla completa, no popup) -->
  <div id="game-page" class="game-page" aria-live="polite"></div>

  <footer class="footer">
    <div class="footer-inner">
      <img class="footer-logo" src="img/PJ-BLANCO-LOGO.png" alt="Placeta Junior" />
      <div class="footer-links">
        <a href="/">Actividades</a>
        Placeta Junior
        <a href="/info">Info</a>
        <a href="https://laplaceta.org" target="_blank" rel="noopener">laplaceta.org</a>
      </div>
      <p class="footer-copy">© 2026 Placeta Junior · Grupo de La Placeta</p>
    </div>
  </footer>

  <!-- Lluvia de confeti al acabar los juegos -->
  <div id="confetti" class="hidden"></div>

  <!-- Zona de impresión para worksheets en PDF A4 -->
  <div id="print-worksheet" class="print-worksheet" aria-hidden="true"></div>

  <script src="js/avisos.js?v=20260820"></script>
  <script src="js/sonidos.js?v=20260820"></script>
  <script src="js/mapa-mundi.js?v=20260820"></script>
  <script src="js/progreso.js?v=20260822"></script>
  <script src="js/partidas.js?v=20260822"></script>
  <script src="js/music.js?v=20260822"></script>
  <script src="js/code-engine.js?v=20260822"></script>
  <script src="js/app.js?v=20260825"></script>
  <script src="js/player.js?v=20260822"></script>
  <script src="js/accesibilidad.js?v=20260811c"></script>
  <script>
    // Modo offline (como la app): service worker que cachea la web y las actividades
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () { /* sin SW */ });
      });
    }
  </script>
</body>
</html>
