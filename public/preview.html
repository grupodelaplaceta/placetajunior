<html lang="es"><head><meta charset="utf-8"><script>try{if(!localStorage.getItem("junior_acc_web"))localStorage.setItem("junior_acc_web",JSON.stringify({idioma:"es",mayus:false,sonido:false}))}catch(e){}</script><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vista previa | Placeta Junior</title>
<link rel="stylesheet" href="css/styles.css?v=20261007-games"><link rel="stylesheet" href="css/home.css"><link rel="stylesheet" href="css/redesign.css"><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/player-skin.css?v=1"><style>.embed .kp-salir,.embed #pj-back{display:none!important}body.embed.mostrando-juego .game-page{padding-top:6px}</style><script>(function(){var d=document.documentElement,n=0,t=setInterval(function(){n++;try{document.fonts.load('24px "Material Symbols Rounded"','home');if(Array.from(document.fonts).some(function(f){return /Material Symbols Rounded/.test(f.family)&&f.status==='loaded'})){clearInterval(t);d.classList.add('ic-ok')}}catch(e){clearInterval(t);d.classList.add('ic-ok')}if(n>40)clearInterval(t)},100)})();</script><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" /><link rel="icon" type="image/png" href="favijunior.png"></head>
<body class="pj-home mostrando-juego"><div id="game-page" class="game-page"><div id="player-content"></div></div><div id="kp-feedback" class="kp-feedback hidden"></div>
<script src="js/sonidos.js"></script><script src="js/mapa-mundi.js"></script><script src="js/progreso.js?v=20261007-games"></script><script src="js/code-engine.js"></script><script src="js/modalidades.js"></script><script src="js/player.js?v=20261007-games"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  try {
    const raw = sessionStorage.getItem('pj-preview-activity') || localStorage.getItem('pj-preview-activity');
    const activity = raw ? JSON.parse(raw) : null;
    if (!activity) throw new Error('No hay actividad para previsualizar.');
    // En preview se pueden recorrer todas las diapositivas sin superar los
    // ejercicios; la aplicación publicada mantiene el desbloqueo progresivo.
    activity._preview = true;
    if (typeof abrirJuego !== 'function') throw new Error('No se pudo cargar el reproductor.');
    var q = new URLSearchParams(location.search);
    abrirJuego(activity);
    if (q.get('embed')) {
      document.body.classList.add('embed');
      var st = parseInt(q.get('start'), 10);
      if (!isNaN(st)) {
        var intentos = 0, iv = setInterval(function () {
          intentos++;
          try {
            if (typeof pantallas !== 'undefined' && pantallas.length > 1) {
              var objetivo = pantallas.findIndex(function (s) { return s.bi === st; });
              if (objetivo > 0) { var saltar = function () { if (pantallaIdx !== objetivo) { pantallaIdx = objetivo; renderPantalla(); } }; saltar(); setTimeout(saltar, 400); setTimeout(saltar, 1000); }
              clearInterval(iv);
            }
          } catch (e) { clearInterval(iv); }
          if (intentos > 40) clearInterval(iv);
        }, 80);
      }
    }
  } catch (error) {
    document.getElementById('player-content').innerHTML = '<main style="max-width:720px;margin:12vh auto;padding:24px;text-align:center"><h1>⚠️ Preview no disponible</h1><p>' + String(error.message || error) + '</p></main>';
  }
});
</script></body></html>
