<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Placeta Junior</title>
  <link rel="stylesheet" href="css/styles.css?v=20261007-games-2" />
  <link rel="stylesheet" href="css/home.css?v=20261007-home-intro-fix" />
  <link rel="stylesheet" href="css/redesign.css?v=20261007-redesign-fix" />
  <link rel="icon" type="image/png" href="favijunior.png" />
  <link rel="preconnect" href="https://admin-placeta.vercel.app" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />

  <meta name="robots" content="noindex" />
  <style>#pj-back{position:fixed;top:max(10px,env(safe-area-inset-top));left:10px;z-index:9;display:none;align-items:center;gap:6px;border:0;border-radius:999px;background:#5B14C8;color:#fff;font:600 15px system-ui,sans-serif;padding:10px 16px;box-shadow:0 3px 0 rgba(0,0,0,.2);cursor:pointer}body:not(.mostrando-juego):not(.mostrando-detalle) #pj-back{display:flex}.hidden-stub{display:none!important}</style>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/player-skin.css?v=1" />
  <script>
    /* Los iconos no se muestran hasta que la fuente está lista (evita ver "close", "chevron_left"...) */
    (function () {
      var d = document.documentElement, n = 0;
      function listo() { d.classList.add('ic-ok'); }
      if (!document.fonts || !document.fonts.load) { listo(); return; }
      var t = setInterval(function () {
        n++;
        try { document.fonts.load('24px "Material Symbols Rounded"', 'home'); if (Array.from(document.fonts).some(function (f) { return /Material Symbols Rounded/.test(f.family) && f.status === 'loaded'; })) { clearInterval(t); listo(); } } catch (e) { clearInterval(t); listo(); }
        if (n > 40) clearInterval(t);
      }, 100);
    })();
  </script>
</head>
<body class="pj-home">
  <!-- Entrada única (se retira cuando el juego ya está pintado) -->
  <div id="pj-loading" class="pj-splash" role="status" aria-live="polite" aria-label="Cargando">
    <div class="pj-splash-in"><img src="img/PJ-BLANCO-LOGO.png" alt="Placeta Junior" width="200" height="87"><div class="pj-splash-dots" aria-hidden="true"><i></i><i></i><i></i></div></div>
  </div>

  <button type="button" id="pj-back" aria-label="Volver">&#8592; Volver</button>
  <!-- Contenedores que app.js espera (no se muestran: el catálogo vive en la página principal) -->
  <div class="hidden-stub" aria-hidden="true"><div id="error-banner"></div><span id="edad-count"></span><div id="populares-row"></div><div id="categorias"></div></div>

  <!-- Página de detalle de actividad (a pantalla completa, no popup) -->
  <div id="detail-page" class="detail-page" aria-live="polite"></div>

  <!-- Página de juego (a pantalla completa, no popup) -->
  <div id="game-page" class="game-page" aria-live="polite"></div>

  <div id="codigo-actividad-modal" class="pj-modal" hidden>
    <div class="pj-modal-card"><button type="button" class="pj-modal-close" onclick="cerrarCodigoActividad()" aria-label="Cerrar">×</button>
      <h2>Usar código de actividad</h2><p>Introduce un código no asignado para jugar una vez. El código seguirá disponible.</p>
      <input id="codigo-actividad-input" autocomplete="off" placeholder="GDLP-XXXX-0000" />
      <button class="btn btn-primary" type="button" onclick="usarCodigoActividad()">Desbloquear y jugar</button>
      <p id="codigo-actividad-error" class="error-banner hidden"></p>
    </div>
  </div>

  <div id="actividad-anuncio-modal" class="pj-modal" hidden aria-live="polite">
    <div class="pj-modal-card pj-anuncio-card">
      <button type="button" class="pj-modal-close" onclick="cerrarAnuncioActividad()" aria-label="Cerrar">×</button>
      <div id="actividad-anuncio-contenido"></div>
    </div>
  </div>

  <!-- Lluvia de confeti al acabar los juegos -->
  <div id="confetti" class="hidden"></div>

  <!-- Zona de impresión para worksheets en PDF A4 -->
  <div id="print-worksheet" class="print-worksheet" aria-hidden="true"></div>


  <script src="js/avisos.js?v=20260820"></script>
  <script src="js/sonidos.js?v=20260829-ui"></script>
  <script src="js/mapa-mundi.js?v=20260902-espana"></script>
  <script src="js/partidas.js?v=20260822"></script>
  <script src="js/music.js?v=20260822"></script>
  <script src="js/code-engine.js?v=20260822"></script>
  <script src="js/modalidades.js?v=20260921"></script>
  <script src="js/app.js?v=20261008-fixes"></script>
  <script src="js/player.js?v=20261008-fixes"></script>
  <script src="js/accesibilidad.js?v=20260902-ico"></script>
  <script>
    /* Aviso a la página principal cuando se sale del juego (o si no hay juego que mostrar) */
    (function () {
      var enviado = false, t, fin = false;
      var splash = function () { return document.getElementById('pj-loading'); };
      function quitarSplash() {
        if (fin) return; fin = true;
        var s = splash(); if (!s) return;
        s.classList.add('is-hidden'); setTimeout(function () { if (s.parentNode) s.remove(); }, 450);
      }
      window.ocultarCarga = function () {}; window.ocultarIntroInicial = function () {};
      setTimeout(quitarSplash, 7000);
      function cerrar() { if (enviado) return; enviado = true; try { parent.postMessage({ pjClose: 1 }, location.origin); } catch (e) { location.href = '/'; } }
      document.getElementById('pj-back').addEventListener('click', cerrar);
      var abierto = false;
      new MutationObserver(function () {
        var on = document.body.classList.contains('mostrando-juego') || document.body.classList.contains('mostrando-detalle');
        if (on) { abierto = true; clearTimeout(t); setTimeout(quitarSplash, 120); return; }
        if (!abierto) return;
        clearTimeout(t);
        t = setTimeout(function () { if (!document.body.classList.contains('mostrando-juego') && !document.body.classList.contains('mostrando-detalle')) cerrar(); }, 500);
      }).observe(document.body, { attributes: true, attributeFilter: ['class'] });
      if (parent === window) document.getElementById('pj-back').addEventListener('click', function () { location.href = '/'; });
    })();
  </script>

  <script>
    /* Traducción de los textos fijos del reproductor (ca / en / eu) */
    (function () {
      var L = 'es'; try { L = JSON.parse(localStorage.getItem('junior_acc_web') || '{}').idioma || 'es'; } catch (e) {}
      if (L === 'es') return; document.documentElement.lang = L;
      var X = {
        ca: { 'Salir':'Sortir','Salir de la actividad':'Surt de l\'activitat','Empieza':'Comença','¡Resultado!':'Resultat!','¡Empezar!':'Comença!','Comprobar':'Comprova','Tu respuesta':'La teva resposta','Siguiente':'Següent','Anterior':'Anterior','Pantalla siguiente':'Pantalla següent','Tu nivel':'El teu nivell','¡Muy bien!':'Molt bé!','Guardar mi progreso':'Desa el meu progrés','puntos verdes':'punts verds','puntos rojos':'punts vermells','Pulsa «¡Empezar!» cuando estés listo.':'Prem «Comença!» quan estiguis llest.','media':'mitjana','fácil':'fàcil','difícil':'difícil','Continuar':'Continua','Reintentar':'Reintenta','Volver a jugar':'Torna a jugar','Resultado':'Resultat','Volver':'Tornar' },
        en: { 'Salir':'Exit','Salir de la actividad':'Leave the activity','Empieza':'Start','¡Resultado!':'Results!','¡Empezar!':'Start!','Comprobar':'Check','Tu respuesta':'Your answer','Siguiente':'Next','Anterior':'Previous','Pantalla siguiente':'Next screen','Tu nivel':'Your level','¡Muy bien!':'Well done!','Guardar mi progreso':'Save my progress','puntos verdes':'green points','puntos rojos':'red points','Pulsa «¡Empezar!» cuando estés listo.':'Press “Start!” when you are ready.','media':'medium','fácil':'easy','difícil':'hard','Continuar':'Continue','Reintentar':'Try again','Volver a jugar':'Play again','Resultado':'Result','Volver':'Back' },
        eu: { 'Salir':'Irten','Salir de la actividad':'Jarduera utzi','Empieza':'Hasi','¡Resultado!':'Emaitza!','¡Empezar!':'Hasi!','Comprobar':'Egiaztatu','Tu respuesta':'Zure erantzuna','Siguiente':'Hurrengoa','Anterior':'Aurrekoa','Pantalla siguiente':'Hurrengo pantaila','Tu nivel':'Zure maila','¡Muy bien!':'Oso ondo!','Guardar mi progreso':'Gorde nire aurrerapena','puntos verdes':'puntu berde','puntos rojos':'puntu gorri','Pulsa «¡Empezar!» cuando estés listo.':'Sakatu «Hasi!» prest zaudenean.','media':'ertaina','fácil':'erraza','difícil':'zaila','Continuar':'Jarraitu','Reintentar':'Saiatu berriro','Volver a jugar':'Berriz jolastu','Resultado':'Emaitza','Volver':'Itzuli' }
      }[L];
      var R = {
        ca: [[/^Pregunta (\d+) de (\d+)$/, 'Pregunta $1 de $2'],[/^Pantalla (\d+) de (\d+)$/, 'Pantalla $1 de $2'],[/^Diapositiva (\d+)$/, 'Diapositiva $1'],[/^La respuesta era: /, 'La resposta era: '],[/^Nivel (\d+)$/, 'Nivell $1']],
        en: [[/^Pregunta (\d+) de (\d+)$/, 'Question $1 of $2'],[/^Pantalla (\d+) de (\d+)$/, 'Screen $1 of $2'],[/^Diapositiva (\d+)$/, 'Slide $1'],[/^La respuesta era: /, 'The answer was: '],[/^Nivel (\d+)$/, 'Level $1']],
        eu: [[/^Pregunta (\d+) de (\d+)$/, 'Galdera $1 / $2'],[/^Pantalla (\d+) de (\d+)$/, 'Pantaila $1 / $2'],[/^Diapositiva (\d+)$/, 'Diapositiba $1'],[/^La respuesta era: /, 'Erantzuna hau zen: '],[/^Nivel (\d+)$/, 'Maila $1']]
      }[L];
      function tx(c) {
        if (X[c]) return X[c];
        for (var i = 0; i < R.length; i++) if (R[i][0].test(c)) return c.replace(R[i][0], R[i][1]);
        return null;
      }
      var busy = false;
      function pasar(root) {
        if (busy || !root) return; busy = true;
        try {
          var w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT), n;
          while ((n = w.nextNode())) {
            var m = n.nodeValue.match(/^(\s*[^\p{L}\d¡¿«]*)([\s\S]*?)([^\p{L}\d.!?»]*\s*)$/u);
            if (!m || !m[2]) continue; var r = tx(m[2]); if (r) n.nodeValue = m[1] + r + m[3];
          }
          root.querySelectorAll('[title],[placeholder],[aria-label]').forEach(function (e) {
            ['title', 'placeholder', 'aria-label'].forEach(function (a) { var v = e.getAttribute(a); if (v) { var r = tx(v.trim()); if (r) e.setAttribute(a, r); } });
          });
        } catch (e) {}
        busy = false;
      }
      var raf = 0;
      new MutationObserver(function () { if (raf) return; raf = requestAnimationFrame(function () { raf = 0; pasar(document.body); }); }).observe(document.body, { childList: true, subtree: true });
      var b = document.getElementById('pj-back'); if (b) b.lastChild.nodeValue = ' ' + (X['Volver'] || 'Volver');
    })();
  </script>
</body>
</html>
